name: Release

# Builds the Windows installer. A tag `v*` publishes it as a GitHub release;
# a manual run only uploads it as an artifact, to try before tagging.
#
# Built here rather than on a developer's machine on purpose: a Rust release
# binary keeps the source paths of where it was compiled in its panic
# messages, and a runner's paths name nobody.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist

      - name: Build
        run: cargo build --profile dist -p nohrs --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'nohrs' | Select-Object -ExpandProperty version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            throw "tag ${{ github.ref_name }} does not match the workspace version ${{ steps.version.outputs.version }}"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DExeSource=..\target\dist\nohrs.exe" `
            installer\prime-files.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-FileHash dist\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Prime Files ${{ steps.version.outputs.version }}
          body_path: installer/RELEASE_NOTES.md
          files: |
            dist/PrimeFiles-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt
