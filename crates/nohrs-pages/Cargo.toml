[package]
name = "nohrs-pages"
description = "Page views (explorer, settings, git, s3) for the nohrs app."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_pages"
path = "src/nohrs_pages.rs"

[dependencies]
nohrs-core     = { path = "../nohrs-core" }
nohrs-models   = { path = "../nohrs-models" }
nohrs-services = { path = "../nohrs-services", features = ["gui"] }
nohrs-store    = { path = "../nohrs-store" }
nohrs-ui       = { path = "../nohrs-ui" }
gpui = "0.2"
gpui-component = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow.workspace     = true
serde.workspace      = true
serde_json.workspace = true
tracing.workspace    = true
time.workspace       = true
# Hands a finished thumbnail from a worker thread back to the pane's task.
async-channel = "2"

# Thumbnails come from the Shell's own extractor (`IShellItemImageFactory`), the
# one Explorer uses: it covers images, video frames, PDFs and program icons in one
# call and reads the system thumbnail cache. Pinned to the version gpui already
# links so no second copy of the bindings enters the tree.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# `test-support` gates `TestAppContext` and the `#[gpui::test]` macro. It is a
# dev-dependency so the gpui test backend only links into the test build.
gpui = { version = "0.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
