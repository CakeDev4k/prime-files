[package]
name = "nohrs"
description = "Prime Files — a fast file explorer for Windows, built in Rust."
keywords = ["launcher", "file-explorer", "file-manager", "gpui", "productivity"]
categories = ["filesystem", "gui"]
readme = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[[bin]]
name = "nohrs"
path = "src/main.rs"

[dependencies]
nohrs-core     = { path = "../nohrs-core" }
nohrs-models   = { path = "../nohrs-models" }
nohrs-services = { path = "../nohrs-services", features = ["gui"] }
nohrs-ui       = { path = "../nohrs-ui" }
nohrs-pages    = { path = "../nohrs-pages" }
nohrs-launcher = { path = "../nohrs-launcher" }
nohrs-store    = { path = "../nohrs-store" }
gpui = "0.2"
gpui-component = "0.5"
tracing.workspace = true
clap.workspace    = true

[build-dependencies]
# Already in the tree through gpui; embeds the icon and version (build.rs).
embed-resource = "3.0"

[lints]
workspace = true
