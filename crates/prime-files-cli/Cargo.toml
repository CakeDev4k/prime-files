[package]
name = "prime-files-cli"
description = "Command-line companion for Prime Files: file operations that default to the trash."
keywords = ["cli", "rm", "trash", "filesystem", "undo"]
categories = ["command-line-utilities", "filesystem"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "prime_files_cli"
path = "src/prime_files_cli.rs"

[[bin]]
# The crate keeps the `prime-files-*` family name; the command itself is short
# because it is typed constantly.
name = "noh"
path = "src/main.rs"

[dependencies]
prime-files-core = { path = "../prime-files-core" }
# The `gui` feature is deliberately off: the CLI needs only `fs`, so it builds
# without any UI toolkit (it is part of `default-members`).
prime-files-services = { path = "../prime-files-services" }
prime-files-store = { path = "../prime-files-store" }
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
dirs = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
