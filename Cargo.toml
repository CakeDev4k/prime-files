[workspace]
resolver = "2"
members = [
  "crates/prime-files",
  "crates/prime-files-cli",
  "crates/prime-files-core",
  "crates/prime-files-models",
  "crates/prime-files-services",
  "crates/prime-files-store",
  "crates/prime-files-ui",
  "crates/prime-files-pages",
  "crates/prime-files-launcher",
  "crates/prime-files-indexer",
]
exclude = ["web", "third_party/gpui"]

# `default-members` keeps a bare `cargo build`/`test`/`clippy` to the crates
# that do not link gpui, which is most of the build time. The window crates
# (prime-files-ui / prime-files-pages / prime-files-launcher / prime-files) and
# the indexer service build with `--workspace` or `-p`.
default-members = [
  "crates/prime-files-cli",
  "crates/prime-files-core",
  "crates/prime-files-models",
  "crates/prime-files-services",
  "crates/prime-files-store",
]

[workspace.package]
version      = "0.3.10"
edition      = "2024"
# Edition 2024 alone would allow 1.85, which is what this said while the real
# floor climbed past it. 1.95 is the release that stabilized `cfg_select!`, used
# by the libsqlite3-sys build script behind rusqlite; the declared graph asks for
# at most 1.89 (redb).
rust-version = "1.95"
license      = "MIT"
repository   = "https://github.com/CakeDev4k/prime-files"
homepage     = "https://github.com/CakeDev4k/prime-files"
# The second entry is the project this one was forked from (see LICENSE).
authors      = ["Prime Files contributors", "nohrs contributors"]

[workspace.dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
clap_complete      = "4"
thiserror          = "2"
tracing            = "0.1"
# `json` renders the file sink as JSON Lines, which is what `noh log` and the
# aggregation behind `noh perf` read; the stderr sink stays human-readable.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender   = "0.2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
time               = { version = "0.3", features = ["formatting", "macros", "parsing"] }
# Benchmarks (testing.md §5). `html_reports` is criterion default; the plotting
# backend is left to gnuplot-or-plotters at runtime.
criterion          = "0.7"

[workspace.lints.rust]
unsafe_code  = "deny"
# Every public item must carry a doc comment (testing.md §3). Promoted to an
# error in CI by `-D warnings`; to be raised to "deny" in P7 (#48).
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# The release build is what `iniciar-prime-files.bat` runs day to day (debug scrolls
# too slowly through big folders), so it is tuned for rebuilding after an edit
# rather than for shipping: incremental keeps the unchanged parts of a crate,
# and more codegen units split the optimizer's work across the cores. The cost
# is a slightly slower binary, not visible in use. Dependencies keep the
# default and are built once.
[profile.release]
incremental = true
codegen-units = 256

# What the installer ships (`cargo build --profile dist`): the release profile
# above is tuned for fast rebuilds while developing, this one for the program
# people run.
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 16

# gpui 0.2.2 with one fix in its Windows drop target (third_party/gpui/PRIME-FILES.md).
# Without it, dragging files out of Prime Files and over its own window crashes.
[patch.crates-io]
gpui = { path = "third_party/gpui" }
